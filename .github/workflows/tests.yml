name: Testes

on:
  push:
    branches: [referencia]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  gdunit4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          version: 'installed'
          paths: 'res://tests'
          timeout: 15
          report-name: relatorio-testes.xml
