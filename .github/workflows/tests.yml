name: Testes

on:
  push:
    branches: [main, desenvolvimento]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          version: 'installed'
          paths: 'res://tests'

  # abre a cena principal sem tela por 300 quadros; o Godot sai com 0 mesmo com erro, entao o log decide
  smoke:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v5
      - run: godot --headless --import
      - run: |
          godot --headless --quit-after 300 2>&1 | tee jogo.log
          if grep -E "ERROR|SCRIPT ERROR" jogo.log; then
            echo "A cena principal gerou erros"
            exit 1
          fi
