name: Release da entrega

on:
  push:
    tags: ['entrega-*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Modelos de exportacao
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/

      - name: Exportar
        run: |
          mkdir -p build/linux
          godot --headless --import
          godot --headless --export-release "Linux" build/linux/TheLastContract.x86_64
          tar -czf TheLastContract-linux.tar.gz -C build/linux .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: TheLastContract-linux.tar.gz

  documento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: projeto.tex
          working_directory: docs

      - uses: actions/upload-artifact@v4
        with:
          name: documento
          path: docs/projeto.pdf

  release:
    needs: [linux, documento]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Entrega ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            TheLastContract-linux.tar.gz
            projeto.pdf
